<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>لوحة ميزان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3EEFA; --surface:#FFFFFF; --ink:#1D1527; --muted:#5A5068; --line:#D9CCEC;
  --plum:#2B1450; --purple:#5B2E91; --purple-soft:#E8DFF5; --orange:#F28C28; --orange-ink:#8A4300;
  --good:#1E6B3A; --bad:#A33A2B;
  --display:'Noto Kufi Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.5;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 64px}
.muted{color:var(--muted)}
.badge{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:999px;background:var(--orange);color:var(--ink);font-weight:700;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 20px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;transition:background-color .15s,border-color .15s}
.btn:hover{border-color:var(--purple)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:#44227A}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.no{border-color:var(--bad);color:var(--bad);background:#fff}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px;border-radius:10px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:15px}
.in{min-height:44px;padding:0 12px;border:1.5px solid #BFAFD9;border-radius:10px;background:#fff;width:100%;min-width:0}
.in:focus{outline:3px solid rgba(242,140,40,.55);outline-offset:0;border-color:var(--purple)}
textarea.in{min-height:90px;padding:10px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 14px 40px -28px rgba(43,20,80,.5)}
.topbar{background:linear-gradient(135deg,var(--plum) 0%,#3B1D69 100%);color:#fff;margin:0 -20px 24px;padding:16px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;border-radius:0 0 18px 18px;box-shadow:0 8px 24px -12px rgba(43,20,80,.5)}
.who{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.who .muted{color:#D8C9F0}
.logo{display:block;width:72px;height:auto}
.brand{font-family:var(--display);font-weight:800;font-size:24px}
.topbar .btn{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}
.topbar .btn:hover{border-color:#fff}
.tabs{display:flex;gap:6px;margin-bottom:24px;background:var(--purple-soft);padding:5px;border-radius:14px;overflow-x:auto;scrollbar-width:thin}
.tab{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:transparent;font-weight:600;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--purple);color:#fff}
.seg{display:flex;gap:6px;background:var(--purple-soft);padding:5px;border-radius:14px}
.seg .tab{flex:1}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:30px;line-height:1.4;font-variant-numeric:tabular-nums;color:var(--plum)}
.kpi span{color:var(--muted);font-size:15px}
.kpi.highlight{border-top-color:var(--purple);background:linear-gradient(180deg,#fff 60%,#F8F4FC)}
.summary-bar{display:flex;flex-wrap:wrap;gap:12px 24px;padding:14px 18px;background:var(--purple-soft);border:1px solid var(--line);border-radius:12px;margin-top:12px;font-size:14.5px;font-variant-numeric:tabular-nums}
.summary-bar strong{color:var(--plum);font-weight:700}
.summary-bar .sep{width:1px;background:var(--line);align-self:stretch;margin:0 4px}
.tbl-footer td{background:#F7F2FC;font-weight:700;border-top:2px solid var(--plum)!important;font-variant-numeric:tabular-nums}
.export-info{font-size:13px;color:var(--muted);margin-top:6px}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
.bar{height:12px;border-radius:6px;background:var(--purple-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--purple);border-radius:6px}
.bar.o i{background:var(--orange)}
.row{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.row .l{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;margin-bottom:14px}
.search{flex:1 1 260px;max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.count{color:var(--muted);font-size:15px;margin-inline-start:auto}
.scroll{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px;font-size:15px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:1;text-align:start;padding:12px;background:var(--purple-soft);font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:#FAF7FE}
td .in{min-height:40px;min-width:100px}
.st{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:600;background:var(--purple-soft);color:var(--purple);white-space:nowrap}
.st.done{background:#D5EBDF;color:var(--good)}
.st.bad{background:#F3D9D4;color:var(--bad)}
.st.new{background:#FBE3C8;color:var(--orange-ink)}
.msg{border-radius:12px;padding:12px 16px;font-size:15px;margin-bottom:20px;border:1px solid var(--line);background:#fff}
.msg.err{border-color:var(--bad);color:var(--bad);font-weight:600;background:#FFF6F4}
.msg.ok{border-color:var(--good);color:var(--good);font-weight:600;background:#F0FAF3}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.center .card{width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}
.center .logo{width:96px}
.addgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.yes{color:var(--good);font-weight:700}.nope{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.nm{display:flex;gap:6px;align-items:center}.nm .in{min-width:130px}
[hidden]{display:none!important}
@media (max-width:640px){.wrap{padding:0 14px 56px}.topbar{margin:0 -14px 18px;padding:12px 14px}.card{padding:18px}.logo{width:60px}.count{margin-inline-start:0;width:100%}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}

.two{gap:16px}.two>.card{min-height:180px}.two h2{font-size:17px!important;margin-bottom:18px!important}.bar{height:10px;background:#eee8f4}.bar i{background:linear-gradient(90deg,#8b67b8,#6540a0)}.bar.o i{background:linear-gradient(90deg,#f5bd6d,#e18a22)}
.toolbar{padding:14px;background:#fff;border:1px solid #e8e0ee;border-radius:16px;box-shadow:0 12px 35px -34px #211039}.search{max-width:460px;min-height:46px;border-radius:12px;background:#fbf9fd}.chips{gap:7px}.chip{min-height:38px;border-color:#e4dbea;border-radius:10px;font-size:13px}.chip[aria-pressed=true]{background:#302047;border-color:#302047}.scroll{border:1px solid #e5ddec;border-radius:16px;box-shadow:0 14px 34px -34px #211039;max-height:70vh}table{font-size:13.5px}th{background:#eee7f5;color:#382650;padding:13px 12px}td{padding:11px 12px}tbody tr:nth-child(even) td{background:#fcfafd}tbody tr:hover td{background:#f5effa}.in{border-color:#ded3e8;border-radius:9px}.in:focus{box-shadow:0 0 0 3px rgba(101,64,160,.12)}.st{font-size:12px;padding:4px 10px}.summary-bar{background:#f4eff8;border-color:#e6dced;border-radius:14px;padding:13px 16px}

/*XLSX-START*/
var MzXlsx=(function(){
  var enc=new TextEncoder(),T=[];
  for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[n]=c>>>0;}

  function zip(files){
    var parts=[],central=[],off=0;
    files.forEach(function(f){
      var name=enc.encode(f.name),d=f.data,cr=crc(d);

      var ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);

    });

    e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);

    all.forEach(function(p){tot+=p.length;});

  }
  function colL(i){var s="";i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}

  }
  function sheetXml(o){
    var maxC=0;o.rows.forEach(function(r){if(r&&r.length>maxC)maxC=r.length;});
    var x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';

  /* minimal one-page PDF that embeds the card JPEG */
  function pdf(jpeg,w,h){
    var enc=new TextEncoder(),chunks=[],len=0,offs=[];
    function add(x){var b=typeof x==="string"?enc.encode(x):x;chunks.push(b);len+=b.length;}
    var PW=595.28,PH=Math.round(PW*h/w*100)/100;
    add("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
    function obj(n,body){offs[n]=len;add(n+" 0 obj\n"+body+"\nendobj\n");}
    obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
    obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
    obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW+" "+PH+"] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
    offs[4]=len;add("4 0 obj\n<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpeg.length+" >>\nstream\n");add(jpeg);add("\nendstream\nendobj\n");
    var cs="q "+PW+" 0 0 "+PH+" 0 0 cm /Im0 Do Q";
    obj(5,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
    var xo=len;
    add("xref\n0 6\n0000000000 65535 f \n");
    for(var i=1;i<=5;i++)add(("0000000000"+offs[i]).slice(-10)+" 00000 n \n");
    add("trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xo+"\n%%EOF\n");
    var out=new Uint8Array(len),p=0;chunks.forEach(function(b){out.set(b,p);p+=b.length;});
    return out;
  }
  function jpegBytes(canvas){
    var b=atob(canvas.toDataURL("image/jpeg",0.92).split(",")[1]),u=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;
  }
  return {draw:draw,pdf:pdf,jpegBytes:jpegBytes};

  if(!S.session||!S.profile||S.profile.status!=="active"||!sb||document.hidden&&false)return;
  rpc("staff_pulse").then(function(p){
    var uid=S.profile.id||"x",kr="mz-seen-r-"+uid,kj="mz-seen-j-"+uid,sr=lsGet(kr),sj=lsGet(kj),parts=[],ceo=S.profile.role==="ceo";

    if(ceo){if(sj===null)lsSet(kj,p.max_job);else if(Number(p.max_job)>Number(sj)){parts.push("طلب توظيف جديد وصل");lsSet(kj,p.max_job);}}
    var n=Number(p.new_requests||0)+(ceo?Number(p.new_jobs||0):0);setTitle(n);
    if(parts.length){
      S.alert={text:parts.join(" + "),tab:parts[0].indexOf("عميل")>=0?"requests":"jobs"};
      beep();
      try{if(window.Notification&&Notification.permission==="granted")new Notification("ميزان",{body:S.alert.text});}catch(e){}
      if(S.tab==="requests"||S.tab==="jobs"){loadTab();}else render();
    }
  }).catch(function(){});
}

function fuCell(r){
  if(!r.follow_up_date)return '<span class="muted">-</span>';
  var due=r.follow_up_date<=dayStr(new Date())&&r.status!=="مكتمل"&&r.status!=="مرفوض";
  return '<span class="st'+(due?" bad":"")+'">'+esc(r.follow_up_date)+(due?" ⏰":"")+'</span>';
}
function assignSel(r){
  return '<select class="in" data-f="assign" data-id="'+r.id+'" aria-label="الـ Assistant"><option value="">'+(r.assigned_name?"":"بدون تعيين")+'</option>'+
    S.assistants.map(function(a){return '<option value="'+esc(a.id)+'"'+(a.id===r.assigned_to?" selected":"")+'>'+esc(a.full_name||a.id)+'</option>';}).join("")+'</select>';
}
function statusSel(r,ceo){

var IMP_KEY="mz-ceo-sess";
function impOn(){try{return !!sessionStorage.getItem(IMP_KEY);}catch(e){return false;}}
function impBar(){return impOn()&&S.profile?'<div class="alertbar"><span>👤 أنت داخل بحساب الموظف: '+esc(S.profile.full_name||S.profile.email)+'</span><button class="btn sm primary" type="button" data-act="back">↩ رجوع لحسابي (CEO)</button></div>':"";}
function enterAs(id){
  S.busy=true;setMsg(null);render();
  sb.auth.getSession().then(function(r){
    var s0=r.data&&r.data.session;if(!s0)throw new Error("انتهت الجلسة. سجّل دخول تاني.");
    return sb.functions.invoke("ceo-enter-as",{body:{user_id:id}}).then(function(x){
      if(x.error||!x.data||!x.data.token_hash){throw new Error((x.data&&x.data.error)||"تعذّر الدخول بحساب الموظف.");}
      return sb.auth.verifyOtp({token_hash:x.data.token_hash,type:"magiclink"});
    }).then(function(v){
      if(v.error||!v.data||!v.data.session)throw (v.error||new Error("تعذّر الدخول بحساب الموظف."));
      try{sessionStorage.setItem(IMP_KEY,JSON.stringify({a:s0.access_token,r:s0.refresh_token}));}catch(e){}
      S.session=v.data.session;S.tab=null;S.users=[];S.requests=[];S.busy=false;
      return loadProfile();
    });
  }).catch(function(e){S.busy=false;setMsg("err",arErr(e));render();});
}
function backToCeo(){
  var o=null;try{o=JSON.parse(sessionStorage.getItem(IMP_KEY)||"null");}catch(e){}
  try{sessionStorage.removeItem(IMP_KEY);}catch(e){}
  if(!o){sb.auth.signOut().then(function(){S.session=null;S.profile=null;S.tab=null;render();});return;}
  sb.auth.setSession({access_token:o.a,refresh_token:o.r}).then(function(r){
    if(r.error||!r.data||!r.data.session)throw (r.error||new Error("انتهت الجلسة. سجّل دخول تاني."));
    S.session=r.data.session;S.tab=null;S.users=[];S.requests=[];return loadProfile();
  }).catch(function(e){S.session=null;S.profile=null;setMsg("err",arErr(e));render();});
}
function openCv(path){
  var w=null;try{w=window.open("","_blank");}catch(e){}
  sb.storage.from("cvs").createSignedUrl(path,300).then(function(r){
    if(r.error||!r.data)throw (r.error||new Error("تعذّر فتح الملف."));
    if(w)w.location.href=r.data.signedUrl;else window.location.href=r.data.signedUrl;
  }).catch(function(e){if(w)w.close();setMsg("err",arErr(e));render();});
}

function render(){
  var el=document.getElementById("app"),h;
  if(!S.booted)h='<div class="center"><p class="muted">جاري التحميل...</p></div>';
  else if(!S.session)h=authView();
  else if(!S.profile)h='<div class="center"><div class="card">'+msgView()+'<p class="muted">جاري تحميل الحساب...</p><button class="btn no" data-act="logout" type="button">تسجيل الخروج</button></div></div>';
  else if(S.profile.status!=="active"||!TABS[S.profile.role])h=holdView();
  else h=appView();
  el.innerHTML=h;
}

app.addEventListener("submit",function(e){
  e.preventDefault();
  var g=function(id){var x=document.getElementById(id);return x?x.value.trim():"";};
  if(e.target.id==="authForm"){
    var email=g("em"),pw=document.getElementById("pw").value;
    S.busy=true;setMsg(null);render();
    var p;
    if(S.mode==="login")p=sb.auth.signInWithPassword({email:email,password:pw});
    else p=sb.auth.signUp({email:email,password:pw,options:{data:{full_name:g("fn"),requested_role:g("rr")}}});
    p.then(function(r){
      if(r.error)throw r.error;
      S.busy=false;
      if(r.data&&r.data.session){S.session=r.data.session;return loadProfile();}
      setMsg("ok","اتبعت طلبك. لو وصلتك رسالة تأكيد على الإيميل اضغط عليها، وبعدها استنى موافقة الـ CEO.");S.mode="login";render();
    }).catch(function(er){S.busy=false;setMsg("err",arErr(er));render();});
  }
  if(e.target.id==="addForm"){
    act(rpc("submit_customer_request",{p_customer_name:g("a1"),p_phone:g("a2"),p_business_name:g("a3"),p_work_type:g("a4"),p_work_location:g("a5"),p_details:g("a6")}).then(function(){setMsg("ok","تمت إضافة الطلب.");}));
  }
});

app.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;
  var a=t.getAttribute("data-act"),id=t.getAttribute("data-id");
  if(a==="mode"){S.mode=t.getAttribute("data-m");setMsg(null);render();}
  if(a==="logout"){try{sessionStorage.removeItem(IMP_KEY);}catch(er){}sb.auth.signOut().then(function(){S.session=null;S.profile=null;S.tab=null;setMsg(null);render();});}
  if(a==="refresh"){setMsg(null);loadProfile();}
  if(a==="tab"){S.tab=t.getAttribute("data-tab");setMsg(null);loadTab();}
  if(a==="rev"){
    var ok=t.getAttribute("data-v")==="1",role=document.getElementById("pr"+id).value;
    act(rpc("ceo_review_access_request",{p_user_id:id,p_approved:ok,p_role:role}).then(function(){setMsg("ok",ok?"تم قبول الحساب.":"تم رفض الطلب.");}));
  }
  if(a==="fs"){if(t.getAttribute("data-k")==="req")S.fs=t.getAttribute("data-v");else S.jfs=t.getAttribute("data-v");render();}
  if(a==="xls")exportExcel();
  if(a==="file")openFile(+id);
  if(a==="alertgo"){var tg=S.alert?S.alert.tab:"requests";S.alert=null;setTitle(0);S.tab=tg;loadTab();}
  if(a==="alertx"){S.alert=null;render();}
  if(a==="notif"){try{Notification.requestPermission().then(function(){render();});}catch(er){}}
  if(a==="trs"||a==="trp"){
    if(a==="trp"&&!window.confirm("مسح نهائي؟ مش هتقدر ترجّعه."))return;
    var cvp=null;
    if(a==="trp"&&t.getAttribute("data-k")==="job"){var it=S.trash.filter(function(x){return x.kind==="job"&&x.id===+id;})[0];cvp=it&&it.cv_path;}
    act(Promise.resolve(cvp?sb.storage.from("cvs").remove([cvp]):null).catch(function(){}).then(function(){return rpc(a==="trs"?"ceo_restore_trash":"ceo_purge_trash",{p_kind:t.getAttribute("data-k"),p_id:+id});}).then(function(){setMsg("ok",a==="trs"?"تم الاسترجاع.":"تم المسح النهائي.");}));
  }
  if(a==="card")openCard(+id);
  if(a==="del"){
    var isReq=t.getAttribute("data-k")==="req";
    if(!window.confirm(isReq?"نقل الطلب رقم "+id+" لسلة المهملات؟ تقدر ترجّعه منها.":"نقل طلب التوظيف رقم "+id+" لسلة المهملات؟ تقدر ترجّعه منها."))return;
    act((isReq?rpc("ceo_delete_request",{p_request_id:+id}):rpc("ceo_delete_job_application",{p_id:+id})).then(function(){setMsg("ok","اتنقل لسلة المهملات.");}));
  }
  if(a==="pw"){
    var np=window.prompt("اكتب كلمة المرور الجديدة للموظف (6 حروف أو أكتر). بعدها ابعتهاله وهيقدر يدخل بيها.");
    if(np===null)return;
    act(rpc("ceo_set_user_password",{p_user_id:id,p_password:np}).then(function(){setMsg("ok","تم تغيير كلمة السر. الموظف يقدر يدخل بيها دلوقتي.");}));
  }
  if(a==="udel"){
    if(!window.confirm("حذف الموظف "+(t.getAttribute("data-n")||"")+" نهائيًا من قاعدة البيانات؟ حسابه هيتمسح ومش هيقدر يدخل تاني."))return;
    act(rpc("ceo_delete_user",{p_user_id:id}).then(function(){setMsg("ok","تم حذف الموظف.");}));
  }
  if(a==="ent")enterAs(id);
  if(a==="back")backToCeo();
  if(a==="cv")openCv(t.getAttribute("data-p"));
  if(a==="nm")act(rpc("ceo_set_user_name",{p_user_id:id,p_name:document.getElementById("nm"+id).value}).then(function(){setMsg("ok","تم حفظ الاسم.");}));
  if(a==="usr")act(rpc("ceo_manage_user",{p_user_id:id,p_action:t.getAttribute("data-v")}));
});

app.addEventListener("input",function(e){
  var el=e.target;if(el.id!=="srch")return;
  var k=el.getAttribute("data-k"),box=document.getElementById("tbl");
  if(k==="req"){S.q=el.value;if(box)box.innerHTML=reqTable();}else{S.jq=el.value;if(box)box.innerHTML=jobTable();}
});

app.addEventListener("change",function(e){
  var el=e.target,f=el.getAttribute("data-f");if(!f)return;
  if(f==="xr"){S.xr=el.value;render();return;}
  if(f==="xf"){S.xf=el.value;return;}
  if(f==="xt"){S.xt=el.value;return;}
  var id=el.getAttribute("data-id");
  if(f==="status")act(rpc("manager_update_request_status",{p_request_id:+id,p_status:el.value}));
  if(f==="jobstatus")act(rpc("ceo_update_job_application_status",{p_id:+id,p_status:el.value}).then(function(){setMsg("ok","تم تحديث حالة الطلب.");}));
  if(f==="progress")act(rpc("manager_update_request_progress",{p_request_id:+id,p_progress:Math.round(Number(el.value))}));
  if(f==="assign"&&el.value)act(rpc("manager_assign_task",{p_request_id:+id,p_assistant_user_id:el.value}).then(function(){setMsg("ok","تم توزيع الشغل.");}));
  if(f==="role")act(rpc("ceo_manage_user",{p_user_id:id,p_action:"change_role",p_role:el.value}));
});

/* ---------- Boot ---------- */
function boot(){
  if(!window.supabase){S.booted=true;setMsg("err","تعذّر تحميل مكتبة الدخول. اتأكد من النت وحدّث الصفحة.");render();return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.getSession().then(function(r){
    S.booted=true;S.session=r.data.session;
    if(S.session)return loadProfile();
    render();
  }).catch(function(e){S.booted=true;setMsg("err",arErr(e));render();});
}
render();boot();
})();
</script>
</body>
</html>
